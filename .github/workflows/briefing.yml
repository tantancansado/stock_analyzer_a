name: Daily Briefing (manual)

# El briefing corre solo al final de daily-analysis.yml. Este workflow lo lanza
# a mano sobre los datos ya publicados — útil para verlo sin re-ejecutar las dos
# horas de pipeline, o para reenviarlo si el envío falló.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = solo imprime el mensaje en el log, no lo manda'
        required: false
        default: 'false'

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main   # los datos del último run, no el commit que disparó esto

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install anthropic pandas

      # Dos pasos excluyentes en vez de una ternaria dentro de `env`. La forma
      # `cond && '' || secrets.X` NO vacía la variable — el 3-ago-2026 mandó un
      # mensaje que se había prometido no mandar. Con `if:` a nivel de paso el
      # comportamiento es inequívoco: al paso de dry-run no se le pasan las
      # credenciales, así que daily_briefing.py entra en su modo de solo imprimir.
      - name: Run briefing (dry-run — solo imprime)
        if: github.event.inputs.dry_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 daily_briefing.py

      - name: Run briefing (envía a Telegram)
        if: github.event.inputs.dry_run != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 daily_briefing.py

      # El contador de gasto de Claude vive en el repo: lo que no se commitea
      # no existe, y el tope de $20 se calcula sobre él. Este workflow es
      # manual y gasta poco, pero gastaba sin dejar rastro — y un contador que
      # marca de menos deja de ser un tope.
      - name: Guardar el gasto de Claude
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/claude_budget.json 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "chore(budget): gasto del briefing manual $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true
