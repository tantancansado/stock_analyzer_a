name: TIKR Weekly Enrichment

on:
  schedule:
    # Sundays 05:23 UTC — irregular time to reduce API fingerprint
    - cron: '23 5 * * 0'
  workflow_dispatch:  # Manual trigger for on-demand runs

jobs:
  tikr-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # Phase 3 takes ~90 min for 105 tickers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pycognito boto3 botocore

      - name: Run TIKR Scraper — Full Universe (~105 tickers)
        env:
          TIKR_EMAIL: ${{ secrets.TIKR_EMAIL }}
          TIKR_PASSWORD: ${{ secrets.TIKR_PASSWORD }}
        run: |
          python3 tikr_scraper.py --run
          echo "Exit code: $?"

      - name: Verify output
        run: |
          # Heredoc con el delimitador entre comillas simples, en vez de pasar
          # el script como argumento entrecomillado de python3.
          # Dentro de comillas dobles bash hace sustitución de comandos con los
          # backticks, y este bloque tiene varios en los comentarios: los de
          # `total` y `errors` se ejecutaban como órdenes y el paso moría con
          # «total: command not found». El scraper había terminado bien y hasta
          # commiteaba, pero el run salía en rojo y tapaba los fallos de verdad.
          python3 - <<'VERIFICA'
          import json, sys
          from pathlib import Path
          p = Path('docs/tikr_earnings_data.json')
          if not p.exists():
              print('ERROR: tikr_earnings_data.json not found')
              sys.exit(1)
          data = json.loads(p.read_text())
          total = data.get('total', 0)
          errors = data.get('errors', [])
          generated = data.get('generated_at', 'unknown')
          print(f'Generated: {generated}')
          print(f'Tickers enriched: {total}')
          print(f'Errors: {len(errors)}')
          if errors:
              for e in errors[:10]:
                  print(f'  - {e}')
          if total < 50:
              print('WARNING: fewer than 50 tickers — check run')

          # Comprobar el CONTENIDO, no solo el recuento.
          #
          # Este paso miraba `total` (137 ✅) y `errors` (0 ✅) y daba el visto
          # bueno. Pero `fetch_tf_financials` devuelve {} ante cualquier fallo
          # SIN registrar error, así que durante cuatro meses la cobertura de
          # cuentas osciló entre el 47% y el 81% —media 62%— y nadie lo supo.
          # El scraper 'funcionaba': 137 tickers, cero errores, y a 5 de cada 13
          # les faltaban las cuentas.
          d = data.get('data', {})
          con_fin = sum(1 for v in d.values() if (v or {}).get('financials_history', {}).get('metrics'))
          con_est = sum(1 for v in d.values() if (v or {}).get('analyst_estimates', {}).get('forward'))
          conservados = sum(1 for v in d.values() if (v or {}).get('financials_history', {}).get('conservado_de'))
          print(f'Con cuentas:      {con_fin}/{len(d)} ({100*con_fin//max(1,len(d))}%)  [{conservados} conservados de semanas anteriores]')
          print(f'Con estimaciones: {con_est}/{len(d)} ({100*con_est//max(1,len(d))}%)')
          # Un ticker US que resuelve a divisa no-USD es OTRA EMPRESA.
          # 'MMC' resolvia a 'MM Conferences S.A.', polaca, a 8,90 PLN — en vez
          # de Marsh & McLennan. Todos sus numeros serian de otra compania, y
          # nada lo delataria: el registro esta completo y es plausible.
          impostores = []
          for t, v in d.items():
              pr = (v or {}).get('price') or {}
              cur = pr.get('curr')
              es_us = '.' not in t and not t.endswith('Y')
              if es_us and cur and cur != 'USD':
                  impostores.append(f"{t}={(v or {}).get('company_name','?')[:28]} ({cur})")
          if impostores:
              print(f'ERROR: {len(impostores)} tickers US resueltos a otra empresa:')
              for x in impostores[:10]:
                  print(f'  - {x}')
              sys.exit(1)

          if len(d) and con_fin / len(d) < 0.75:
              print(f'ERROR: solo el {100*con_fin//len(d)}% tiene cuentas. Con el arrastre de')
              print('semanas anteriores esto deberia rondar el 99%: si baja del 75% es que')
              print('algo pasa con /tf o con el fichero anterior.')
              sys.exit(1)
          VERIFICA

      - name: Commit enriched data
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"

          git add docs/tikr_earnings_data.json docs/tikr_id_cache.json || true

          RUN_DATE=$(date +%Y-%m-%d)
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: TIKR weekly enrichment - ${RUN_DATE}" \
                       -m "Automated via GitHub Actions (tikr-enrichment.yml)"

          # Push with retry: fetch + rebase before each attempt
          push_with_retry() {
            for i in 1 2 3; do
              git fetch origin main
              git rebase origin/main && git push && echo "Push OK (attempt $i)" && return 0
              git rebase --abort 2>/dev/null || true
              echo "Attempt $i failed, retrying..."
              sleep $((i * 5))
            done
            echo "All push attempts failed — data committed locally but not pushed"
            return 1
          }
          push_with_retry || true

env:
  PYTHONUNBUFFERED: 1
