name: Portfolio News Monitor

on:
  # PAUSADO: cada 6h — alerts de posiciones (cartera vacía)
  # schedule:
  #  # Every 6 hours: 06:00, 12:00, 18:00, 00:00 UTC
  #  - cron: '0 6,12,18,0 * * 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests

      - name: Run Portfolio News Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_MONITOR_USER_ID: ${{ secrets.SUPABASE_MONITOR_USER_ID }}
        run: python3 portfolio_news_monitor.py || echo "Portfolio monitor failed"

      # Sin commit ni deploy: el resultado va a Supabase (por usuario) y a
      # privado/. Antes se commiteaba a docs/, que es público.

env:
  PYTHONUNBUFFERED: 1
